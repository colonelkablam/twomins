[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twomin"
version = "0.1.0"
description = "Two-minute start timer for getting going on avoided tasks"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.scripts]
twomin = "twomin.__main__:main"

[tool.setuptools.packages.find]
include = ["twomin*"]

[tool.setuptools.package-data]
twomin = ["assets/*"]
